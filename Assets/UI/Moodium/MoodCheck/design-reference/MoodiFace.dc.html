<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Moodi 表情</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: block">
  <svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="{{label}}" style="display: block; overflow: visible">
    <defs>
      <radialGradient id="moodiBody" cx="0.38" cy="0.3" r="0.82">
        <stop offset="0" stop-color="#EEE8FF"></stop>
        <stop offset="0.42" stop-color="#BDA8F8"></stop>
        <stop offset="1" stop-color="#8A6CE4"></stop>
      </radialGradient>
      <radialGradient id="moodiLimb" cx="0.35" cy="0.3" r="0.9">
        <stop offset="0" stop-color="#DCD0FF"></stop>
        <stop offset="1" stop-color="#9B7FEC"></stop>
      </radialGradient>
    </defs>

    <sc-if value="{{arms.up}}" hint-placeholder-val="{{ false }}">
      <ellipse cx="22" cy="55" rx="11.5" ry="7" transform="rotate(-42 22 55)" fill="url(#moodiLimb)"></ellipse>
      <ellipse cx="98" cy="55" rx="11.5" ry="7" transform="rotate(42 98 55)" fill="url(#moodiLimb)"></ellipse>
    </sc-if>
    <sc-if value="{{arms.relaxed}}" hint-placeholder-val="{{ true }}">
      <ellipse cx="20" cy="70" rx="11.5" ry="7" transform="rotate(-14 20 70)" fill="url(#moodiLimb)"></ellipse>
      <ellipse cx="100" cy="70" rx="11.5" ry="7" transform="rotate(14 100 70)" fill="url(#moodiLimb)"></ellipse>
    </sc-if>
    <sc-if value="{{arms.down}}" hint-placeholder-val="{{ false }}">
      <ellipse cx="24" cy="81" rx="11" ry="6.5" transform="rotate(32 24 81)" fill="url(#moodiLimb)"></ellipse>
      <ellipse cx="96" cy="81" rx="11" ry="6.5" transform="rotate(-32 96 81)" fill="url(#moodiLimb)"></ellipse>
    </sc-if>

    <ellipse cx="60" cy="64" rx="40" ry="38" fill="url(#moodiBody)" stroke="rgba(255,255,255,0.45)" stroke-width="0.8"></ellipse>
    <ellipse cx="45" cy="44" rx="13" ry="7.5" transform="rotate(-24 45 44)" fill="#FFFFFF" opacity="0.38"></ellipse>

    <sc-if value="{{sprout.up}}" hint-placeholder-val="{{ true }}">
      <path d="M60 28 C 59.5 23, 60 19.5, 60 17" fill="none" stroke="#A88EF3" stroke-width="3.6" stroke-linecap="round"></path>
      <ellipse cx="53" cy="14" rx="7.5" ry="4.6" transform="rotate(-32 53 14)" fill="url(#moodiLimb)"></ellipse>
      <ellipse cx="67" cy="14" rx="7.5" ry="4.6" transform="rotate(32 67 14)" fill="url(#moodiLimb)"></ellipse>
    </sc-if>
    <sc-if value="{{sprout.droop}}" hint-placeholder-val="{{ false }}">
      <path d="M60 28 C 59.5 24, 60 21.5, 60 20" fill="none" stroke="#A88EF3" stroke-width="3.6" stroke-linecap="round"></path>
      <ellipse cx="52.5" cy="22" rx="7.5" ry="4.4" transform="rotate(34 52.5 22)" fill="url(#moodiLimb)"></ellipse>
      <ellipse cx="67.5" cy="22" rx="7.5" ry="4.4" transform="rotate(-34 67.5 22)" fill="url(#moodiLimb)"></ellipse>
    </sc-if>

    <ellipse cx="37" cy="74" rx="6.5" ry="3.6" fill="#FF97B4" opacity="0.5"></ellipse>
    <ellipse cx="83" cy="74" rx="6.5" ry="3.6" fill="#FF97B4" opacity="0.5"></ellipse>

    <sc-if value="{{eyes.open}}" hint-placeholder-val="{{ false }}">
      <ellipse cx="46" cy="62" rx="5" ry="6" fill="#241A3F"></ellipse>
      <ellipse cx="74" cy="62" rx="5" ry="6" fill="#241A3F"></ellipse>
      <circle cx="47.8" cy="59.6" r="1.9" fill="#FFFFFF"></circle>
      <circle cx="75.8" cy="59.6" r="1.9" fill="#FFFFFF"></circle>
    </sc-if>
    <sc-if value="{{eyes.closed}}" hint-placeholder-val="{{ true }}">
      <path d="M41 62 Q 46 67 51 62" fill="none" stroke="#241A3F" stroke-width="2.6" stroke-linecap="round"></path>
      <path d="M69 62 Q 74 67 79 62" fill="none" stroke="#241A3F" stroke-width="2.6" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{eyes.tired}}" hint-placeholder-val="{{ false }}">
      <path d="M41.5 62.5 A 4.6 4.6 0 0 0 50.5 62.5 Z" fill="#241A3F"></path>
      <path d="M69.5 62.5 A 4.6 4.6 0 0 0 78.5 62.5 Z" fill="#241A3F"></path>
      <path d="M40 57.5 L 50.5 55" fill="none" stroke="#241A3F" stroke-width="2.2" stroke-linecap="round"></path>
      <path d="M80 57.5 L 69.5 55" fill="none" stroke="#241A3F" stroke-width="2.2" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{brows.tense}}" hint-placeholder-val="{{ false }}">
      <path d="M40 52.5 L 51 55.5" fill="none" stroke="#241A3F" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M80 52.5 L 69 55.5" fill="none" stroke="#241A3F" stroke-width="2.4" stroke-linecap="round"></path>
    </sc-if>

    <sc-if value="{{mouth.happy}}" hint-placeholder-val="{{ false }}">
      <path d="M52 72 Q 60 84 68 72 Z" fill="#3A2356"></path>
      <path d="M55.5 77.2 Q 60 81.6 64.5 77.2 Q 60 75.4 55.5 77.2 Z" fill="#FF8DA6"></path>
    </sc-if>
    <sc-if value="{{mouth.calm}}" hint-placeholder-val="{{ true }}">
      <path d="M53.5 73.5 Q 60 79 66.5 73.5" fill="none" stroke="#241A3F" stroke-width="2.4" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{mouth.neutral}}" hint-placeholder-val="{{ false }}">
      <path d="M54.5 75 L 65.5 75" fill="none" stroke="#241A3F" stroke-width="2.4" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{mouth.low}}" hint-placeholder-val="{{ false }}">
      <path d="M54 78 Q 60 72.5 66 78" fill="none" stroke="#241A3F" stroke-width="2.4" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{mouth.tense}}" hint-placeholder-val="{{ false }}">
      <path d="M51.5 76 L 55.75 73.5 L 60 76 L 64.25 73.5 L 68.5 76" fill="none" stroke="#241A3F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["happy","calm","neutral","low","tense"],"default":"calm"},"size":{"editor":"int","default":160,"min":24,"max":480,"unit":"px"},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood ?? 'calm';
    const size = Number(this.props.size) || 160;
    const labels = { happy: 'Moodi 开心', calm: 'Moodi 平静', neutral: 'Moodi 一般', low: 'Moodi 低落', tense: 'Moodi 烦躁' };
    return {
      px: size + 'px',
      label: labels[m] || 'Moodi',
      arms: { up: m === 'happy' || m === 'tense', relaxed: m === 'calm' || m === 'neutral', down: m === 'low' },
      sprout: { up: m !== 'low', droop: m === 'low' },
      eyes: { open: m === 'happy' || m === 'neutral' || m === 'tense', closed: m === 'calm', tired: m === 'low' },
      brows: { tense: m === 'tense' },
      mouth: { happy: m === 'happy', calm: m === 'calm', neutral: m === 'neutral', low: m === 'low', tense: m === 'tense' }
    };
  }
}
</script>
</body>
</html>
