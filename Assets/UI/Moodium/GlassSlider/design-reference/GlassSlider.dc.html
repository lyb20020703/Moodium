<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>液态玻璃滑块</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;family=Noto+Sans+SC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gs-track{position:absolute;inset:0;border-radius:999px;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.gs-track::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(170deg,rgba(255,255,255,0.95),rgba(255,255,255,0.18) 38%,rgba(255,255,255,0.06) 60%,rgba(255,255,255,0.55));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.gs-knob::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1.5px;background:linear-gradient(150deg,rgba(255,255,255,1),rgba(255,255,255,0.25) 45%,rgba(255,255,255,0.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
</style>
</helmet>
<div style="position: relative; width: {{s.w}}; height: {{s.h}}; font-family: -apple-system, 'SF Pro Text', Inter, 'PingFang SC', 'Noto Sans SC', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: -18%; border-radius: 999px; {{s.glow}}"></div>
  <div class="gs-track" style="{{s.track}}"></div>
  <div aria-hidden="true" style="position: absolute; border-radius: 999px; {{s.fill}}"></div>
  <div aria-hidden="true" style="position: absolute; left: 7%; right: 7%; top: 5%; height: 34%; border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0)); {{s.sheenOpacity}}"></div>
  <span style="position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 600; letter-spacing: 0.04em; text-shadow: 0 1px 10px rgba(60,30,90,0.25); white-space: nowrap; {{s.label}}">{{s.text}}</span>
  <sc-if value="{{s.chevrons}}" hint-placeholder-val="{{ true }}">
    <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; display: flex; align-items: center; color: rgba(255,255,255,0.55); font-weight: 600; letter-spacing: -0.12em; {{s.chev}}">›››</span>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; border-radius: 50%; {{s.knobGlow}}"></div>
  <div class="gs-knob" style="position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; {{s.knob}}">
    <div aria-hidden="true" style="position: absolute; left: 18%; top: 10%; width: 46%; height: 30%; border-radius: 50%; background: rgba(255,255,255,0.55); transform: rotate(-24deg)"></div>
    <sc-if value="{{s.arrow}}" hint-placeholder-val="{{ true }}">
      <svg viewBox="0 0 24 24" width="{{s.icon}}" height="{{s.icon}}" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position: relative"><path d="M5 12h13M13 6l6 6-6 6"></path></svg>
    </sc-if>
    <sc-if value="{{s.check}}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 24 24" width="{{s.icon}}" height="{{s.icon}}" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="position: relative"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"world":{"editor":"enum","options":["nature","candy"],"default":"nature"},"progress":{"editor":"range","default":0,"min":0,"max":1,"step":0.01},"mode":{"editor":"enum","options":["idle","hover","drag","done"],"default":"idle"},"width":{"editor":"int","default":560,"min":160,"max":1200,"unit":"px"},"label":{"editor":"text","default":"进入自然世界"},"$preview":{"width":560,"height":136}}'>
class Component extends DCLogic {
  renderVals() {
    const world = this.props.world ?? 'nature';
    const mode = this.props.mode ?? 'idle';
    const w = Number(this.props.width) || 560;
    const h = Math.round(w * 0.243);
    const done = mode === 'done';
    const p = done ? 1 : Math.max(0, Math.min(1, Number(this.props.progress ?? 0)));
    const label = this.props.label ?? (world === 'candy' ? '进入糖果世界' : '进入自然世界');
    const T = world === 'candy'
      ? { tint: '255,170,214', knobA: '#FFF0F7', knobB: '#FFB3D4', knobC: '#E879B4', glow: '255,140,200', fillA: '255,190,225', fillB: '244,130,190' }
      : { tint: '170,230,190', knobA: '#EFFFF2', knobB: '#9EE5AE', knobC: '#4FB866', glow: '120,220,150', fillA: '190,240,200', fillB: '96,196,120' };
    const knob = Math.round(h * 0.84);
    const m = (h - knob) / 2;
    const travel = w - 2 * m - knob;
    const kx = m + travel * p;
    const hover = mode === 'hover';
    const glowA = done ? 0.75 : hover ? 0.5 : 0.28 + 0.35 * p;
    const fillW = Math.max(knob, kx + knob - m);
    const fillOpacity = done ? 1 : Math.min(1, p * 3);
    const labelLeft0 = m + knob;
    const labelOpacity = done ? 1 : Math.max(0, 1 - p * 1.6);
    const fs = Math.round(h * 0.25);
    return {
      s: {
        w: w + 'px', h: h + 'px', icon: Math.round(knob * 0.42),
        text: done ? '正在进入…' : label,
        arrow: !done, check: done,
        chevrons: !done && p < 0.05,
        glow: 'background: radial-gradient(closest-side, rgba(' + T.glow + ',' + glowA.toFixed(2) + '), rgba(' + T.glow + ',0)); filter: blur(6px)',
        track: 'background: linear-gradient(180deg, rgba(' + T.tint + ',' + (hover ? 0.42 : 0.32) + ') 0%, rgba(255,255,255,0.12) 55%, rgba(' + T.tint + ',0.22) 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.65), inset 0 -8px 18px rgba(255,255,255,0.10), 0 10px 30px rgba(40,20,70,0.22)',
        fill: 'left: ' + m + 'px; top: ' + m + 'px; height: ' + knob + 'px; width: ' + (done ? (w - 2 * m) : fillW) + 'px; opacity: ' + fillOpacity.toFixed(2) + '; background: linear-gradient(90deg, rgba(' + T.fillA + ',0.10), rgba(' + T.fillB + ',0.62)); transition: width .25s cubic-bezier(.2,.8,.2,1)',
        sheenOpacity: 'opacity: ' + (hover || done ? 1 : 0.75),
        label: (done ? 'left: 0; right: 0;' : 'left: ' + labelLeft0 + 'px; right: ' + m + 'px;') + ' font-size: ' + fs + 'px; opacity: ' + labelOpacity.toFixed(2),
        chev: 'right: ' + Math.round(m + knob * 0.35) + 'px; font-size: ' + Math.round(fs * 0.9) + 'px',
        knobGlow: 'left: ' + (kx - knob * 0.35) + 'px; top: ' + (m - knob * 0.35) + 'px; width: ' + (knob * 1.7) + 'px; height: ' + (knob * 1.7) + 'px; background: radial-gradient(closest-side, rgba(' + T.glow + ',' + (0.35 + 0.5 * p).toFixed(2) + '), rgba(' + T.glow + ',0))',
        knob: 'left: ' + kx + 'px; top: ' + m + 'px; width: ' + knob + 'px; height: ' + knob + 'px; background: radial-gradient(circle at 34% 28%, ' + T.knobA + ' 0%, ' + T.knobB + ' 45%, ' + T.knobC + ' 100%); box-shadow: inset 0 -6px 14px rgba(255,255,255,0.25), 0 6px 16px rgba(40,20,70,0.28)' + (hover ? ', 0 0 0 5px rgba(255,255,255,0.18)' : '') + '; transform: scale(' + (mode === 'drag' ? 1.06 : 1) + '); transition: transform .18s cubic-bezier(.2,.8,.2,1)'
      }
    };
  }
}
</script>
</body>
</html>
